name: Windows build and release
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified release
        type: boolean
        default: true
      release_tag:
        description: Release tag matching the project version
        type: string
        default: v1.1.3
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.401'
      - name: Build, verify routing and package
        shell: pwsh
        run: ./scripts/Build.ps1 -Dotnet (Get-Command dotnet).Source -OutputDirectory dist/release
      - name: Verify installer payload
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'ProxyChoicePro-verify'
          $arguments = '--verify "' + $target + '"'
          $process = Start-Process -FilePath './dist/release/ProxyChoicePro-Setup.exe' -ArgumentList $arguments -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000) -or $process.ExitCode -ne 0) { throw 'Installer verification failed.' }
          if ((Get-FileHash "$target/ProxyChoicePro.exe").Hash -ne (Get-FileHash './dist/release/ProxyChoicePro.exe').Hash) { throw 'Installer payload differs from the standalone application.' }
      - name: Audit public source package
        shell: pwsh
        run: |
          [xml]$project = Get-Content './src/ProxyChoiceApp/ProxyChoiceApp.csproj'
          $version = $project.Project.PropertyGroup.Version
          ./scripts/Test-PublicPackage.ps1 -ArchivePath "./dist/release/ProxyChoicePro-$version-source.zip" -ReportPath ./artifacts/privacy-package.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ProxyChoicePro-win-x64
          path: |
            dist/release/ProxyChoicePro.exe
            dist/release/ProxyChoicePro-Setup.exe
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
            artifacts/privacy-source.json
            artifacts/privacy-package.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          [xml]$project = Get-Content './src/ProxyChoiceApp/ProxyChoiceApp.csproj'
          if ($env:RELEASE_TAG -ne ('v' + $project.Project.PropertyGroup.Version)) { throw 'The release tag must match the project version.' }
          $version = $project.Project.PropertyGroup.Version
          $artifacts = @('./dist/release/ProxyChoicePro.exe', './dist/release/ProxyChoicePro-Setup.exe', "./dist/release/ProxyChoicePro-$version-source.zip", "./dist/release/ProxyChoicePro-$version-win-x64.zip", './dist/release/SHA256SUMS.txt')
          foreach ($file in $artifacts) { if (-not (Test-Path -LiteralPath $file)) { throw "Missing release asset: $file" } }
          gh release view "$env:RELEASE_TAG" --json assets --jq '.assets | length'
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" @artifacts --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
            gh release edit "$env:RELEASE_TAG" --draft=false --title "ProxyChoicePro $env:RELEASE_TAG" --notes-file ./docs/ReleaseNotes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          } else {
            gh release create "$env:RELEASE_TAG" @artifacts --target "$env:GITHUB_SHA" --title "ProxyChoicePro $env:RELEASE_TAG" --notes-file ./docs/ReleaseNotes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          }
          $published = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.draft -or $published.assets.Count -ne 5) { throw 'Published release is incomplete.' }
          foreach ($line in (Get-Content './dist/release/SHA256SUMS.txt')) {
            $parts = $line -split '\s+',2
            $asset = @($published.assets | Where-Object { $_.name -eq $parts[1] })
            if ($asset.Count -ne 1 -or $asset[0].digest -ne ('sha256:' + $parts[0])) { throw 'Published asset checksum mismatch.' }
          }
          if ($env:RELEASE_TAG -eq 'v1.1.3') {
            gh release view v1.0.0 --json tagName > $null
            if ($LASTEXITCODE -eq 0) {
              gh release delete v1.0.0 --yes
              if ($LASTEXITCODE -ne 0) { throw 'Could not remove the superseded release.' }
            }
          }

