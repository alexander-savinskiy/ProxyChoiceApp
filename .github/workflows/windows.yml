name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified release
        type: boolean
        default: true
      release_tag:
        description: Release tag matching the project version
        type: string
        default: v1.0.0
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.401'
      - name: Build, verify routing and package
        shell: pwsh
        run: ./scripts/Build.ps1 -Dotnet (Get-Command dotnet).Source -OutputDirectory dist/release
      - name: Verify installer payload
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'ProxyChoiceApp-verify'
          $arguments = '--verify "' + $target + '"'
          $process = Start-Process -FilePath './dist/release/ProxyChoiceApp-Setup.exe' -ArgumentList $arguments -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000) -or $process.ExitCode -ne 0) { throw 'Installer verification failed.' }
          if ((Get-FileHash "$target/ProxyChoiceApp.exe").Hash -ne (Get-FileHash './dist/release/ProxyChoiceApp.exe').Hash) { throw 'Installer payload differs from the standalone application.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ProxyChoiceApp-win-x64
          path: |
            dist/release/ProxyChoiceApp.exe
            dist/release/ProxyChoiceApp-Setup.exe
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          [xml]$project = Get-Content './src/ProxyChoiceApp/ProxyChoiceApp.csproj'
          if ($env:RELEASE_TAG -ne ('v' + $project.Project.PropertyGroup.Version)) { throw 'The release tag must match the project version.' }
          gh release view "$env:RELEASE_TAG" --json assets --jq '.assets | length'
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" ./dist/release/ProxyChoiceApp.exe ./dist/release/ProxyChoiceApp-Setup.exe ./dist/release/*.zip ./dist/release/SHA256SUMS.txt --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
            gh release edit "$env:RELEASE_TAG" --draft=false --title "ProxyChoiceApp $env:RELEASE_TAG" --notes-file ./docs/ReleaseNotes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          } else {
            gh release create "$env:RELEASE_TAG" ./dist/release/ProxyChoiceApp.exe ./dist/release/ProxyChoiceApp-Setup.exe ./dist/release/*.zip ./dist/release/SHA256SUMS.txt --title "ProxyChoiceApp $env:RELEASE_TAG" --notes-file ./docs/ReleaseNotes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          }

